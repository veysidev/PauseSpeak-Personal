<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PauseSpeak</title>

  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #eaf1f3;
      background: linear-gradient(145deg, #1b282e, #24373e);
    }

    h1 {
      margin: 0;
      color: #f1f4f5;
      font-size: 22px;
      line-height: 1.15;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: inline-flex;
      flex: 0 0 48px;
      align-items: center;
      justify-content: center;
      color: #7bd7ea;
      background: rgba(38, 56, 64, 0.92);
      border: 1px solid rgba(133, 194, 209, 0.2);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(6, 15, 19, 0.3);
    }

    .brand-mark svg {
      width: 30px;
      height: 26px;
    }

    .brand-mark rect {
      fill: currentColor;
    }

    .brand-mark path {
      fill: none;
      stroke: #58c7e5;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      margin-top: 4px;
      color: #7bd7ea;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 16px;
      color: #a9bbc2;
      font-size: 13px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(133, 194, 209, 0.2);
      border-radius: 10px;
      color: #edf2f3;
      background: rgba(16, 28, 34, 0.76);
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(88, 199, 229, 0.42);
      border-radius: 10px;
      cursor: pointer;
      color: #ecfeff;
      background: linear-gradient(110deg, #43b7d2, #237e99);
      font-size: 13px;
      font-weight: 700;
    }

    button.secondary {
      color: #eaf1f3;
      border-color: rgba(133, 194, 209, 0.18);
      background: rgba(42, 60, 68, 0.9);
    }

    button:hover,
    button:focus-visible {
      border-color: #7bd7ea;
      outline: none;
      filter: brightness(1.08);
    }

    #status {
      min-height: 18px;
      margin: 12px 0 0;
      color: #7bd7ea;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 28 24">
        <rect x="3" y="4" width="3.5" height="16" rx="1.75" />
        <rect x="9" y="4" width="3.5" height="16" rx="1.75" />
        <path d="M16 14l2.2-4 2.4 7 2.1-10 2.3 7" />
      </svg>
    </span>

    <div>
      <h1>PauseSpeak</h1>
      <div class="eyebrow">Duraklat · Dinle · Konuş</div>
    </div>
  </div>

  <p>
    Bilgisayar ve tablette aynı kodu kaydet.
    Günlük kullanım iki cihazda ortak görünür.
  </p>

  <label for="syncCode">
    Sayaç senkronizasyon kodu
  </label>

  <input
    id="syncCode"
    type="text"
    autocomplete="off"
    spellcheck="false"
    placeholder="Kod oluştur veya diğer cihazdan yapıştır"
  />

  <div class="actions">
    <button id="saveButton">
      Kaydet
    </button>

    <button
      id="copyButton"
      class="secondary"
    >
      Kopyala
    </button>

    <button
      id="generateButton"
      class="secondary"
    >
      Yeni Kod Oluştur
    </button>

    <button
      id="clearButton"
      class="secondary"
    >
      Yerel Moda Dön
    </button>
  </div>

  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
